name: Build macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyqtgraph PyOpenGL numpy openpyxl pillow py2app

      - name: Generate icon.icns
        run: python make_icns.py

      - name: Build .app
        run: python setup.py py2app

      - name: Verify build
        run: |
          ls -la dist/
          test -d dist/PalletPacker.app

      - name: Zip .app
        run: |
          cd dist
          zip -r PalletPacker-mac.zip PalletPacker.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalletPacker-mac
          path: dist/PalletPacker-mac.zip
          if-no-files-found: error
